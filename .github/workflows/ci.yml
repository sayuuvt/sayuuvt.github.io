name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/main.js
      - run: node --check doar/donations.js
      - run: node --test tests/*.test.cjs
      - run: python3 -m py_compile tools/optimize-images.py
