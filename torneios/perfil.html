<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com; connect-src http://127.0.0.1:5126; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SaYuuVT | Perfil competitivo</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="ladder.css"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="profile.js" defer></script></head>
<body class="ladder"><header class="ladder-header"><a href="../"><img src="../assets/logo.webp" alt="SaYuuVT"></a><nav><a href="./">Torneios</a><a href="perfil.html" aria-current="page">Perfil</a></nav></header>
<main class="ladder-main"><section class="ladder-hero"><p class="eyebrow">CONTA COMPETITIVA</p><h1>Meu perfil</h1><p class="notice">Teste local. O login ainda não está habilitado no GitHub Pages publicado.</p><button id="login" type="button" disabled>Entrar com Discord</button><button id="logout" type="button" hidden>Sair</button><p id="status" role="status"></p></section>
<section class="ladder-panel" id="profile" hidden><h2>Dados competitivos</h2><img id="discord-avatar" width="64" height="64" alt="Avatar do Discord"><p id="discord-name"></p>
<form id="profile-form"><div class="ladder-fields"><label>Nickname<input name="nick" maxlength="40" required></label><label>Time<input name="team" maxlength="40"></label><label>País (código ISO de 2 letras)<input name="country" maxlength="2" minlength="2" pattern="[A-Za-z]{2}" required placeholder="BR"></label><label>Estado / região<input name="region" maxlength="80"></label><label>Cidade (opcional)<input name="city" maxlength="80"></label></div><button type="submit">Salvar perfil</button></form></section></main><footer class="ladder-footer">SaYuuVT · Desenvolvimento local</footer></body></html>
