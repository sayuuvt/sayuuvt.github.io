<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SaYuuVT</title>
  <meta name="description" content="SaYuuVT — VTuber e streamer. Todas as redes sociais e contato profissional em um só lugar.">
  <!-- Cor da barra do tema no celular; o Discord usa a mesma cor na faixa lateral do cartão de preview -->
  <meta name="theme-color" content="#ff003c">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SaYuuVT">
  <meta property="og:title" content="SaYuuVT">
  <meta property="og:description" content="Lives na Twitch, vídeos, redes sociais e contato profissional.">
  <meta property="og:url" content="https://sayuuvt.github.io/">
  <meta property="og:image" content="https://sayuuvt.github.io/assets/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SaYuuVT: foto de perfil e logo sobre uma cena de poker em tons escuros">
  <link rel="canonical" href="https://sayuuvt.github.io/">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@SaYuuVT">
  <meta name="twitter:title" content="SaYuuVT">
  <meta name="twitter:description" content="Lives na Twitch, vídeos, redes sociais e contato profissional.">
  <meta name="twitter:image" content="https://sayuuvt.github.io/assets/og-image.jpg">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="assets/bg.webp" media="(orientation: landscape)">
  <link rel="preload" as="image" href="assets/bg-mobile.webp" media="(orientation: portrait)">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="card">
    <header class="hero">
      <a class="avatar" href="https://www.twitch.tv/sayuuvt" target="_blank" rel="noopener" aria-label="Abrir canal na Twitch">
        <img src="assets/avatar.webp" alt="" width="640" height="640">
        <span class="live-badge" data-live-badge hidden>Ao vivo</span>
      </a>
      <h1 class="logo">
        <img src="assets/logo.webp" alt="SaYuuVT" width="900" height="601">
      </h1>
    </header>

    <section class="group" aria-labelledby="redes-title">
      <h2 class="group-title" id="redes-title">Redes Sociais</h2>
      <ul class="links">
        <li>
          <a class="link" href="https://www.twitch.tv/sayuuvt" target="_blank" rel="noopener" style="--brand: #a970ff" data-twitch-link>
            <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#twitch"></use></svg>
            <span class="link-text">
              <span class="link-label">Twitch <span class="live-tag" data-live-tag hidden>Ao vivo</span></span>
              <span class="link-sub" data-twitch-sub>Lives</span>
            </span>
            <svg class="link-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"></use></svg>
          </a>
        </li>
        <li>
          <a class="link" href="https://www.youtube.com/@SaYuuVT/" target="_blank" rel="noopener" style="--brand: #ff2a2a">
            <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#youtube"></use></svg>
            <span class="link-text">
              <span class="link-label">YouTube</span>
              <span class="link-sub">Vídeos e cortes</span>
            </span>
            <svg class="link-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"></use></svg>
          </a>
        </li>
        <li>
          <a class="link" href="https://www.instagram.com/sayuuvt/" target="_blank" rel="noopener" style="--brand: #ff5be8">
            <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#instagram"></use></svg>
            <span class="link-text">
              <span class="link-label">Instagram</span>
              <span class="link-sub">@sayuuvt</span>
            </span>
            <svg class="link-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"></use></svg>
          </a>
        </li>
        <li>
          <a class="link" href="https://x.com/SaYuuVT" target="_blank" rel="noopener" style="--brand: #e8edf6">
            <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#x"></use></svg>
            <span class="link-text">
              <span class="link-label">X (Twitter)</span>
              <span class="link-sub">@SaYuuVT</span>
            </span>
            <svg class="link-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"></use></svg>
          </a>
        </li>
        <li>
          <a class="link" href="https://discord.gg/ujydhHTA35" target="_blank" rel="noopener" style="--brand: #7984ff">
            <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#discord"></use></svg>
            <span class="link-text">
              <span class="link-label">Discord</span>
              <span class="link-sub">Entre na comunidade</span>
            </span>
            <svg class="link-arrow" aria-hidden="true"><use href="assets/icons.svg#arrow"></use></svg>
          </a>
        </li>
      </ul>
    </section>

    <!-- E-mail montado pelo JS a partir de data-user/data-domain (dificulta scrapers) -->
    <section class="group" aria-labelledby="contato-title" data-contact hidden>
      <h2 class="group-title" id="contato-title">Contato Profissional</h2>
      <div class="contact">
        <a class="link" style="--brand: #ffd500" data-email data-user="mayuaratol" data-domain="gmail.com">
          <svg class="link-icon" aria-hidden="true"><use href="assets/icons.svg#mail"></use></svg>
          <span class="link-text">
            <span class="link-label">E-mail</span>
            <span class="link-sub" data-email-text></span>
          </span>
        </a>
        <button class="copy" type="button" data-copy aria-label="Copiar e-mail">Copiar</button>
      </div>
    </section>

    <footer class="footer">
      <p>© <span data-year>2026</span> SaYuuVT</p>
    </footer>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
